<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>APP Creación de artículos</title>
<style>
:root{--bg:#f2f4f6;--pn:#fff;--ink:#17212b;--mut:#5d6b78;--ln:#d9dfe5;--ac:#0b6b8a}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--pn:#18212a;--ink:#e8edf2;--mut:#9aa8b5;--ln:#2b3844;--ac:#5cb8d6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,"Segoe UI",system-ui,sans-serif;padding:16px}
form{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:28px;width:100%;max-width:360px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--mut);font-size:14px}
input{width:100%;font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:9px 10px;margin-bottom:12px}
button{width:100%;font:inherit;font-weight:600;border:0;border-radius:4px;padding:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
#msg{color:#b3261e;font-size:14px;margin-top:10px;min-height:1.5em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
 <h1>APP · Creación de artículos</h1>
 <p>Contenido protegido. Escribe la clave para abrir la APP.</p>
 <input type="password" id="pw" placeholder="Clave" autofocus required>
 <button id="bt">Entrar</button>
 <div id="msg" role="alert"></div>
</form>
<script>
// La APP y su data están cifradas (AES-256-CBC + HMAC-SHA256, llave derivada con PBKDF2-SHA256).
// Se descifran aquí, en el navegador; la clave no sale de este equipo.
(()=>{
  const CFG={salt:'ccTBvCa4RNupzGcWZTT8/A==',iter:310000};
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('no se pudo descargar '+u);return r.arrayBuffer();};
  async function decryptor(bits){
    const enc=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
    const mac=await crypto.subtle.importKey('raw',bits.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
    return async buf=>{const u=new Uint8Array(buf),n=u.length-32;
      if(n<32||!await crypto.subtle.verify('HMAC',mac,u.slice(n),u.slice(0,n)))throw new Error('CLAVE');
      return crypto.subtle.decrypt({name:'AES-CBC',iv:u.slice(0,16)},enc,u.slice(16,n));};
  }
  async function abrir(bits){
    const dec=await decryptor(bits),td=new TextDecoder();
    const app=td.decode(await dec(await get('data/app.bin')));
    const man=JSON.parse(td.decode(await dec(await get('data/manifest.bin'))));
    try{sessionStorage.setItem('app-k',btoa(String.fromCharCode(...bits)));}catch(e){}
    window.__SEC={decrypt:dec,files:man.files,lists:man.lists};
    document.open();document.write(app);document.close();
  }
  const msg=document.getElementById('msg'),bt=document.getElementById('bt');
  // Misma pestaña: no volver a pedir la clave al recargar
  try{const k=sessionStorage.getItem('app-k');if(k)abrir(b64(k)).catch(()=>sessionStorage.removeItem('app-k'));}catch(e){}
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();msg.textContent='';bt.disabled=true;bt.textContent='Abriendo…';
    try{
      if(!window.crypto||!crypto.subtle)throw new Error('Este navegador no permite descifrar (abre la página con https).');
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveBits']);
      const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.iter,hash:'SHA-256'},base,512));
      await abrir(bits);
    }catch(err){msg.textContent=err.message==='CLAVE'?'Clave incorrecta.':err.message;bt.disabled=false;bt.textContent='Entrar';}
  };
})();
</script>
</body>
</html>
